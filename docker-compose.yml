# Runs the full stack locally: PostgreSQL + the AutoShine app (API + React UI).
#   docker compose up --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoshine
      POSTGRES_USER: autoshine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoshine -d autoshine"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: autoshine:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=autoshine;Username=autoshine;Password=${POSTGRES_PASSWORD}"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Seed__DemoUsers: ${SEED_DEMO_USERS:-false}
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-}
      Shop__TimeZone: ${SHOP_TIMEZONE:-UTC}

volumes:
  pgdata:
